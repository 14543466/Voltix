name: Build Voltix APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Voltix project
        run: |
          mkdir temp
          unzip Voltix-Android-Cloud-Build-v0.5.zip -d temp
          cp -r temp/Voltix-Android/. .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Voltix-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
